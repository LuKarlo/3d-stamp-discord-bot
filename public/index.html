<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bambu Lab Live Stream</title>
  <style>
    body { 
      margin: 0; 
      background-color: #1e1e2e; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      overflow: hidden;
    }
    canvas { 
      width: 100%; 
      max-width: 1280px; 
      height: auto; 
      background-color: #000000;
    }
  </style>
  <script src="https://jsmpeg.com/jsmpeg.min.js"></script>
</head>
<body>
  <canvas id="video-canvas"></canvas>

  <script type="module">
    import { DiscordSDK } from "https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.1.0/+esm";

    // 1. Inizializzazione sicura dell'SDK di Discord
    const urlParams = new URLSearchParams(window.location.search);
    
    if (urlParams.has("frame_id")) {
      try {
        const sdk = new DiscordSDK('1546183235367604244');
        await sdk.ready();
        console.log('✅ Discord SDK pronto');
      } catch (err) {
        console.warn('⚠️ Errore durante l\'inizializzazione di Discord SDK:', err);
      }
    } else {
      console.log('ℹ️ Accesso diretto da browser (nessun frame_id di Discord rilevato).');
    }

    // 2. Avvio del Player Video JSMpeg
    try {
      const canvas = document.getElementById('video-canvas');
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/api/stream`;

      const player = new JSMpeg.Player(wsUrl, {
        canvas: canvas,
        autoplay: true,
        audio: false,
      });
      console.log('🎥 JSMpeg Player connesso a:', wsUrl);
    } catch (err) {
      console.error('❌ Errore nell\'avvio di JSMpeg:', err);
    }
  </script>
</body>
</html>
